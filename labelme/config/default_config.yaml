auto_save: false
display_label_popup: true
store_data: true
keep_prev: false
keep_prev_scale: false
keep_prev_brightness: false
keep_prev_contrast: false
logger_level: info

flags: null
label_flags: null
labels: null
file_search: null
sort_labels: true
validate_label: null
sort_images: name

default_shape_color: [0, 255, 0]
shape_color: auto
shift_auto_shape_color: 0
label_colors: null

shape:
  line_color: [0, 255, 0, 128]
  fill_color: [0, 255, 0, 0]
  vertex_fill_color: [0, 255, 0, 255]
  select_line_color: [255, 255, 255, 255]
  select_fill_color: [0, 255, 0, 155]
  hvertex_fill_color: [255, 255, 255, 255]
  point_size: 8

flag_dock:
  show: true
  closable: true
  movable: true
  floatable: true
label_dock:
  show: true
  closable: true
  movable: true
  floatable: true
shape_dock:
  show: true
  closable: true
  movable: true
  floatable: true
file_dock:
  show: true
  closable: true
  movable: true
  floatable: true

show_label_text_field: true
label_completion: startswith
fit_to_content:
  column: true
  row: false

epsilon: 10.0
ctrl_snap_multiplier: 3.0
vertex_highlight_size: 2
canvas:
  double_click: null
  num_backups: 10
  crosshair:
    polygon: false
    rectangle: true
    circle: false
    line: false
    point: false
    linestrip: false
    polygonSAM: false

sam:
  # Default to vit_b (~362 MB) rather than vit_h (~2.4 GB).
  # Rationale: first run downloads this file in the background; a 2.4 GB
  # download is a bad first experience and needs ~10 GB+ VRAM. vit_b still
  # gives usable masks on an 8 GB card. Switch to vit_l / vit_h once the
  # workflow is verified, see README section on model tiers.
  weights: vit_b
  maxside: 1280
  approxpoly_epsilon: 1
  device: cuda

shortcuts:
  close: Ctrl+W
  open: Ctrl+O
  open_dir: Ctrl+U
  quit: Ctrl+Q
  save: Ctrl+S
  save_as: Ctrl+Shift+S
  save_to: null
  delete_file: Ctrl+Delete
  open_next: [D, Ctrl+Shift+D]
  open_prev: [A, Ctrl+Shift+A]
  zoom_in: [Ctrl++, Ctrl+=]
  zoom_out: Ctrl+-
  zoom_to_original: Ctrl+0
  fit_window: Ctrl+F
  fit_width: Ctrl+Shift+F
  create_polygon: Ctrl+N
  create_rectangle: Ctrl+R
  create_circle: null
  create_line: null
  create_point: null
  create_linestrip: null
  edit_polygon: Ctrl+J
  delete_polygon: Delete
  duplicate_polygon: Ctrl+D
  copy_polygon: Ctrl+C
  paste_polygon: Ctrl+V
  undo: Ctrl+Z
  undo_last_point: Ctrl+Z
  add_point_to_edge: Ctrl+Shift+P
  edit_label: Ctrl+E
  toggle_keep_prev_mode: Ctrl+P
  remove_selected_point: [Meta+H, Backspace]
